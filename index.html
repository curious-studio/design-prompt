<body>

<div class="hero" aria-hidden="true"></div>

<main class="container">

        <div class="masthead">
        <div class="masthead-header">
            <h1>Brand Prompt Generator</h1>
            <div class="theme-toggle">
                <label for="theme-switch" class="switch-label">

        </div>
        <p class="lead">Use the options provided for each category, or customize them to fit your project.</p>
    </div>
    
    <div class="input-group">
        <label>Clients</label>
        <textarea id="clients">small airline, coffee shop, dentist, school, noodle restaurant, food truck, fin-tech startup, handyman service, dog groomer, pizza shop, tree trimmer, home remodeler, crossfit gym, summer camp, bakery, grocery store, donut shop, recording studio, deli, pool hall, dance studio, lawncare service, garden center, taco shop, small hotel, hockey gear store, music store</textarea>
    </div>

    <div class="input-group">
        <label>Locations</label>
        <textarea id="locations">a small town, Denver, a large city, an east coast city, a college town, a national park, New England, the Mid-Atlantic, the Southeast, the Deep South, the Midwest, the Great Plains, the Southwest, the Rocky Mountains, the Pacific Northwest, a West Coast community, the Great Lakes Region, Appalachia, the Gulf Coast</textarea>

    <div class="input-group">
        <label>Demographics</label>
        <textarea id="demographics">elementary kids, large families, urban residents, rural populations, suburban households, senior citizens living independently, retirees, first-time homebuyers, working professionals, small business owners, stay-at-home parents, single-parent families, dual-income households, recent immigrants, military veterans, Gen Z consumers, millennials, baby boomers, seasonal residents, middle-class families, renters, teenagers, young professionals, empty nesters, urban commuters, homeowners, college graduates, single adults, parents of young children</textarea>
    </div>

    <div class="input-group">
        <label>Descriptors</label>
        <textarea id="descriptors">adventurous, analytical, artisanal, athletic, audacious, authentic, beautiful, bold, brave, bright, careful, caring, childlike, clean, clever, competent, confident, delicate, dignified, dynamic, electrifying, elegant, elevated, embellished, encouraging, energetic, fast, fearless, ferocious, focused, fresh, friendly, futuristic, gourmet, gracious, handcrafted, healthy, helpful, heritage, heroic, hospitable, imaginative, in motion, intelligent, inventive, joyful, kind, logical, luxurious, majestic, merry, mesmerizing, mysterious, mystical, natural, noble, nostalgic, nourishing, optimistic, organic, personal, pioneering, playful, posh, powerful, practical, pragmatic, precise, prestigious, prudent, pure, quiet, quirky, radiant, refined, refreshing, relaxed, robust, rough, rugged, sacred, safe, secret, serene, simple, sincere, slow, solid, sophisticated, stable, status, sturdy, stylish, sweet, theoretical, thoughtful, thrilling, tranquil, trustworthy, unexpected, vigorous, warm, welcoming, wholesome, wild, wise, witty</textarea>
    </div>

    <div class="input-group">
        <label>Colors</label>

    <div class="btn-container">
        <button id="generate">Generate Prompt</button>

    <div id="output">What will you make today?</div>
    <div id="copyStatus">Copied to clipboard!</div>
    <div class="spacer"></div>

</main>

<script>
// Theme toggle functionality
(function() {
    const themeSwitch = document.getElementById('theme-switch');
    const htmlElement = document.documentElement;

    // Load theme preference from localStorage
    const savedTheme = localStorage.getItem('theme-preference') || 'light';
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeSwitch.checked = true;
    }

    // Toggle theme on switch change
    themeSwitch.addEventListener('change', function() {
        if (this.checked) {
            document.body.classList.add('dark-mode');
            localStorage.setItem('theme-preference', 'dark');
        } else {
            document.body.classList.remove('dark-mode');
            localStorage.setItem('theme-preference', 'light');
        }
    });
})();
</script>

<script>
(function() {
    const genBtn = document.getElementById('generate');
    const copyBtn = document.getElementById('copyBtn');
    const output = document.getElementById('output');
    const copyStatus = document.getElementById('copyStatus');

    // Helper to get random item from comma-separated or newline-separated text
    function pickRandom(id) {
        const text = document.getElementById(id).value;
        const items = text.split(/[,\n]/)
                          .map(s => s.trim())
                          .filter(s => s.length > 0 && !s.includes('[source'));
        return items[Math.floor(Math.random() * items.length)];
    }

    // Generate Prompt function
    genBtn.addEventListener('click', function() {
        try {
            const biz = pickRandom('clients');
            const loc = pickRandom('locations');
            const demo = pickRandom('demographics');
            const color = pickRandom('colors');
            
            const descInput = document.getElementById('descriptors').value;
            const descPool = descInput.split(/[,\n]/).map(s => s.trim()).filter(s => s.length > 0);
            const selectedDesc = [];
            
            while(selectedDesc.length < 3 && descPool.length > 3) {
                const pick = descPool[Math.floor(Math.random() * descPool.length)];
                if(!selectedDesc.includes(pick)) {
                    selectedDesc.push(pick);
                }
            }

            const prompt = "<span>Design a brand for a <strong>" + biz + "</strong> in <strong>" + loc + "</strong> whose clients are <strong>" + demo + "</strong>. The brand should feel <strong>" + selectedDesc[0] + "</strong>, <strong>" + selectedDesc[1] + "</strong> and <strong>" + selectedDesc[2] + "</strong>, and should use <strong>" + color + "</strong> as one of its key colors.</span>";
            
            output.innerHTML = prompt;
            
            // Show the copy button once a prompt exists
            copyBtn.style.display = "block";
            copyStatus.style.display = "none"; 
        } catch (err) {
            output.innerHTML = "Error generating prompt. Please check your list formatting.";
            console.error(err);
        }
    });

    // Standalone Copy function
    copyBtn.addEventListener('click', function() {
        const textToCopy = output.innerText; // .innerText strips the <strong> tags
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            // Show feedback
            copyStatus.style.display = "block";
            
            // Hide feedback after 2 seconds
            setTimeout(() => {
                copyStatus.style.display = "none";
            }, 2000);
        }).catch(err => {
            console.error('Could not copy text: ', err);
        });
    });

})();
</script>
